name: Build PJU Selaras APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          SDKMGR="$(command -v sdkmanager || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1)"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          fi
          mkdir -p "${ANDROID_HOME:-/usr/local/lib/android/sdk}/licenses"
          grep -qxF "24333f8a63b6825ea9c5514f83c2829b004d1fee" "${ANDROID_HOME:-/usr/local/lib/android/sdk}/licenses/android-sdk-license" 2>/dev/null || printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" >> "${ANDROID_HOME:-/usr/local/lib/android/sdk}/licenses/android-sdk-license"
          grep -qxF "84831b9409646a918e30573bab4c9c91346d8abd" "${ANDROID_HOME:-/usr/local/lib/android/sdk}/licenses/android-sdk-preview-license" 2>/dev/null || printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" >> "${ANDROID_HOME:-/usr/local/lib/android/sdk}/licenses/android-sdk-preview-license"

      - name: Prepare signing keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              echo "::error::File app/google-services.json tidak ikut ter-push ke GitHub. Tambahkan Secret bernama GOOGLE_SERVICES_JSON di Settings -> Secrets and variables -> Actions."
              exit 1
            fi
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PJU-Selaras-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk PJU-Selaras.apk
          gh release create "$TAG" PJU-Selaras.apk \
            --title "PJU Selaras APK (Build #${{ github.run_number }})" \
            --notes "Unduh file PJU-Selaras.apk di bawah ini untuk langsung memasang aplikasi di HP Android Anda."
